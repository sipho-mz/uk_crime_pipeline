[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk_crime_pipeline"
dynamic = ["version"]
description = "Pulls and cleans UK Crime data"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Sipho", email = "siphozwanem@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "duckdb>=1.5.5",
    "pyarrow>=25.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.165.7",
    "ruff>=0.16.5",
    "validate-pyproject>=0.26"
]

[tool.hatch.version]
path = "src/uk_crime_pipeline/__about__.py"

# Configure Pytest
[tool.pytest.ini_options]
minversion = "9.1.1"
addopts = "-ra -q --cov=src"
testpaths = ["tests"]

# Configure Ruff (Linter and Formatter)
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "S"]
